name: Deploy to EasyPanel

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'README.md'

# Workflow configurado para deploy automático a EasyPanel
# Se activa automáticamente en cada push a main

jobs:
  deploy:
    name: Deploy to EasyPanel
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger EasyPanel Deploy
        run: |
          echo "🚀 Triggering EasyPanel deployment..."
          curl -X POST "http://217.216.48.47:3000/api/compose/deploy/a55b2faea182d5cf488d16aeb060e87c2686ff719f8a28cb" \
            -H "Content-Type: application/json" \
            -w "\nHTTP Status: %{http_code}\n"
          
          if [ $? -eq 0 ]; then
            echo "✅ Deploy triggered successfully"
          else
            echo "❌ Failed to trigger deploy"
            exit 1
          fi
